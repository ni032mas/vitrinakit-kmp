name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    name: Verify SDK
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install security tooling
        run: brew install gitleaks

      - name: Verify
        run: make verify
